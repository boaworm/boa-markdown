name: BoaMarkdown
options:
  bundleIdPrefix: io.github.boaworm
  deploymentTarget:
    macOS: "12.0"
settings:
  MARKETING_VERSION: ${MARKETING_VERSION}
  CURRENT_PROJECT_VERSION: ${CURRENT_PROJECT_VERSION}
packages:
  BoaRender:
    path: Packages/BoaRender
targets:
  Markdown:
    type: application
    platform: macOS
    sources: 
      - Sources/Markdown
      - Sources/Shared
      - path: Renderer
        type: folder
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: "BoaMarkdown"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.boaworm.Markdown
        INFOPLIST_FILE: Sources/Markdown/Info.plist
        INFOPLIST_KEY_NSMainStoryboardFile: ""
        ENABLE_PREVIEWS: NO
        MARKETING_VERSION: ${MARKETING_VERSION}
        CURRENT_PROJECT_VERSION: ${CURRENT_PROJECT_VERSION}
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/Markdown/Markdown.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/Markdown/MarkdownRelease.entitlements
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    dependencies:
      - package: BoaRender

  MarkdownTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MarkdownTests
      - Sources/Markdown/WindowAccessor.swift
      - Sources/Markdown/ResourceLoader.swift
      - Sources/Shared
      - benchmark/swift-bench/RenderBenchmarkTests.swift
      - path: Renderer
        type: folder
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: io.github.boaworm.Markdown.Tests
      MARKETING_VERSION: ${MARKETING_VERSION}
      CURRENT_PROJECT_VERSION: ${CURRENT_PROJECT_VERSION}
    dependencies:
      - package: BoaRender
schemes:
  Markdown:
    build:
      targets:
        Markdown: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: MarkdownTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
