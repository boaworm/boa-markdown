name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos-build-test:
    name: macOS build + XCTest
    runs-on: macos-15
    env:
      CI: true
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          rm -rf BoaMarkdown.xcodeproj
          FULL_V="$(cat .version)"
          BUILD="$(echo "$FULL_V" | cut -d'.' -f3)"
          MARKETING_VERSION="$FULL_V" CURRENT_PROJECT_VERSION="$BUILD" xcodegen generate --quiet

      - name: Run Swift tests (skip benchmarks)
        run: |
          xcodebuild test \
            -project BoaMarkdown.xcodeproj \
            -scheme Markdown \
            -configuration Debug \
            -destination 'platform=macOS' \
            -skip-testing:MarkdownTests/RenderBenchmarkTests \
            CODE_SIGNING_ALLOWED=NO

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
